version: '3.4'

services:
  eodprices:
    image: python:3.11-slim
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - APP_HOME=/app
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt && python app.py"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
