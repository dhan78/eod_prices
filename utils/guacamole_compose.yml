#####################################################################################
# Guacamole Docker Compose file
# Default login to the Guacamole web interface:
#     Username: guacadmin
#     Password: guacadmin
# Create proxy network once
# podman network create proxy

# Start containers
# podman-compose -f docker-compose.yml up -d

#####################################################################################
#####################################################################################
# Guacamole Docker Compose file
# Default login to the Guacamole web interface:
#     Username: guacadmin
#     Password: guacadmin
#####################################################################################

services:
  # Guacamole daemon (guacd)
  guacd:
    container_name: guacd
    image: guacamole/guacd:latest
    restart: always
    networks:
      - guacnetwork
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw

  # MySQL database for Guacamole
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./init:/docker-entrypoint-initdb.d:z
      - ./data:/var/lib/mysql:z   # Added :z for SELinux context relabeling
    networks:
      - guacnetwork

  # Guacamole web application
  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:latest
    env_file:
      - .env
    group_add:
      - "1000"
    depends_on:
      - guacd
      - mysql
    environment:
      - GUACD_HOSTNAME=${GUACD_HOSTNAME}
      - MYSQL_HOSTNAME=${MYSQL_HOSTNAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - RECORDING_SEARCH_PATH=${RECORDING_SEARCH_PATH}
      - WEBAPP_CONTEXT=${WEBAPP_CONTEXT}
    networks:
      - proxy
      - guacnetwork
    volumes:
      - ./record:/record:rw
    ports:
      ## Enable next line if not using Traefik or nginx
      - ${GUACAMOLE_PORT}:8080/tcp
      ## Enable next line when using nginx only
      # - 8080/tcp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole.entrypoints=http"
      - "traefik.http.routers.guacamole.rule=Host(`${GUACAMOLE_DOMAIN}`)"
      - "traefik.http.middlewares.guacamole-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.guacamole.middlewares=guacamole-https-redirect"
      - "traefik.http.routers.guacamole-secure.entrypoints=https"
      - "traefik.http.routers.guacamole-secure.rule=Host(`${GUACAMOLE_DOMAIN}`)"
      - "traefik.http.routers.guacamole-secure.tls=true"
      - "traefik.http.routers.guacamole-secure.service=guacamole"
      - "traefik.http.services.guacamole.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    restart: always

networks:
  guacnetwork:
    driver: bridge
  proxy:
    external: true
